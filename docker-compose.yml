services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///data/tasklane.db}
    volumes:
      - tasklane_sqlite:/app/data
    ports: ["${BACKEND_PORT:-8000}:8000"]
  frontend:
    build: ./frontent
    depends_on: [backend]
    ports: ["${FRONTEND_PORT:-5173}:80"]
volumes:
  tasklane_sqlite:
